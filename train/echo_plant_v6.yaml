# Design at da4326b: knee direct on one RS04 (no linkage). Ankle pitch on one RS03 through a rod at 1.5:1, roll on one RS06 through a rod at 1.32:1, constant ratio.
# v5d's plant with urdf/echo.xml's exact values: armature, and ankle_roll effort 47.5, not 47.
# The plant SuperMimic drives echo with. Keys are substrings of the joint name, first match wins.
# effort, armature: urdf/echo.xml, itself from spec/actuators.json through tools/make_robot_files.py. Peak torques are retailer
# numbers; armature and friction are estimates until the datasheets. Change them there, not here.
# stiffness, damping: ours, a tracking choice and not a property of the design. kp about 1 N m/rad per N m of peak on the
# legs, as G1's BeyondMimic gains (hip 99 N m/rad on 88 N m), half that at the shoulder pitch, which carries only an arm;
# kd = 0.06 kp, again as G1's. The light wrists, forearm twist and neck get less: at 0.84 N m s/rad a hand diverged at the 5 ms step. Action scale = 0.25 effort / (armature w^2), the X2's convention.
